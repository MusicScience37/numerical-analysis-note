[project]
name = "numerical-analysis-note"
version = "0.0.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "num_anal_plots" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
click = "^8.5.0"
plotly = "^7.1.0"
pandas = "^3.1.0"
kaleido = "^1.5.0"
msgpack = "^1.2.4"
scipy = "^1.18.1"
ms37-designs = { git = "https://gitlab.com/MusicScience37Projects/utility-libraries/ms37-designs.git", rev = "549d3e6a95f289aac9061f44cfbdb977bc5de465" }
setuptools = "^84.2.1"

[tool.poetry.group.web.dependencies]
sphinx = "^9.2.0"
sphinxext-opengraph = "^0.13.0"
sphinxcontrib-bibtex = "^2.7.0"
sphinx-orange-book-theme = "^0.22.0"
myst-nb = "^1.4.0"
jupyterlab = "^4.6.4"
ipywidgets = "^8.1.9"
ipython = "^9.17.1"
ipykernel = "^7.4.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pre-commit = "^4.7.0"
doc8 = "^2.0.0"
sphinx-autobuild = "^2025.8.25"
isort = "^9.0.2"
pylint = "^4.1.3"
flake8 = "^7.4.1"
mypy = "^2.4.0"
pandas-stubs = "^3.0.5.260914"
playwright = "^1.64.1"

[project.scripts]
make_pdf_plot = "num_anal_plots.make_pdf_plot:make_pdf_plot"

[tool.isort]
profile = "black"

[tool.pylint]
disable = ["E1120", "C0301", "R0912", "R0801", "R1735"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
